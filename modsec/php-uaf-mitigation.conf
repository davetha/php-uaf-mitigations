# php-uaf mod_security rules - outermost, most bypassable ring.
# Deploy: include this file from your modsec user config, or paste rules into
# cPanel WHM (Security Center >> ModSecurity Tools >> Rules List).
# Rules 1000001/1000002 are custom signatures for this family; tune for your
# app (legitimate apps that serialize into forms will trip 1000002).

# Interim rule from the disclosure coverage (kept verbatim, including IDs):
# https://pentestit.com/php-cve-2026-109618-and-cve-2026-109619-what-we-know-about-php2shell/
SecRule ARGS_POST_NAMES "@streq PHP_SESSION_UPLOAD_PROGRESS" "id:1026109618,phase:2,deny,status:403,log,severity:CRITICAL,t:none,msg:'PHP session upload progress field (interim, PHP CVE-2026-109618/109619)'"

# phar:// stream wrapper referenced in any request input (credit: Dom).
# Catches the app-opening-user-controlled-phar-path vector; urlDecodeUni
# defeats percent-encoding evasions. Add the JSON body processor
# (SecRule REQUEST_HEADERS:Content-Type application/json ...) for full
# coverage of API payloads.
SecRule ARGS|ARGS_NAMES|REQUEST_COOKIES|REQUEST_FILENAME|XML:/*|REQUEST_BODY \
    "@rx (?i)phar:/" \
    "id:1026300100,phase:2,deny,status:403,log,t:none,t:urlDecodeUni,\
    msg:'phar:// stream wrapper in request'"

# phar archive signature in ordinary params/headers. CAVEAT: multipart file
# CONTENTS are not visible to ARGS/REQUEST_BODY - for real upload scanning
# use @inspectFile; the php-side phar.readonly=On setting is the stronger
# content-side block.
SecRule REQUEST_BODY|REQUEST_HEADERS|ARGS "@rx __HALT_COMPILER" "id:1000001,phase:2,deny,status:403,log,msg:'phar upload blocked'"

# obvious serialized-object payloads in request parameters:
SecRule ARGS|REQUEST_BODY "@rx (O|C):[0-9]{1,4}:\"[A-Za-z0-9_\\\\]+" "id:1000002,phase:2,t:none,deny,status:403,log,msg:'serialized object in request'"

# gadget-class names inside serialized payloads (extend per app):
SecRule ARGS|REQUEST_BODY "@rx (O|C):[0-9]{1,4}:\"(GuzzleHttp|Monolog|Symfony)" "id:1000003,phase:2,t:none,deny,status:403,log,msg:'known gadget class in serialized payload'"
