# php-uaf mod_security rules - outermost, most bypassable ring.
# Deploy: include this file from your modsec user config, or paste rules into
# cPanel WHM (Security Center >> ModSecurity Tools >> Rules List).
# Rules 1000001/1000002 are custom signatures for this family; tune for your
# app (legitimate apps that serialize into forms will trip 1000002).

# Interim rule from the disclosure coverage (kept verbatim, including IDs):
# https://pentestit.com/php-cve-2026-109618-and-cve-2026-109619-what-we-know-about-php2shell/
SecRule ARGS_POST_NAMES "@streq PHP_SESSION_UPLOAD_PROGRESS" "id:1026109618,phase:2,deny,status:403,log,severity:CRITICAL,t:none,msg:'PHP session upload progress field (interim, PHP CVE-2026-109618/109619)'"

# phar:// stream wrapper referenced in any request input (credit: Dom).
# Catches the app-opening-user-controlled-phar-path vector; urlDecodeUni
# defeats percent-encoding evasions. NOTE: JSON request bodies need a JSON
# body processor or they are only visible via the REQUEST_BODY match below -
# CRS 3+ enables one (rule 901320); without CRS, uncomment the ctl rule here.
SecRule ARGS|ARGS_NAMES|REQUEST_COOKIES|REQUEST_FILENAME|XML:/*|REQUEST_BODY \
    "@rx (?i)phar:/" \
    "id:1026300100,phase:2,deny,status:403,log,t:none,t:urlDecodeUni,\
    msg:'phar:// stream wrapper in request'"

# Without CRS, enable JSON body parsing so the rules above see API payloads:
# SecRule REQUEST_HEADERS:Content-Type "^application/json" \
#     "id:1026399999,phase:1,pass,nolog,ctl:requestBodyProcessor=JSON"

# phar archive signature in ordinary params/headers. CAVEAT: multipart file
# CONTENTS are not visible to ARGS/REQUEST_BODY - for real upload scanning
# use @inspectFile; the php-side phar.readonly=On setting is the stronger
# content-side block.
SecRule REQUEST_BODY|REQUEST_HEADERS|ARGS "@rx __HALT_COMPILER" "id:1000001,phase:2,deny,status:403,log,msg:'phar upload blocked'"

# obvious serialized-object payloads in request parameters:
SecRule ARGS|REQUEST_BODY "@rx (O|C):[0-9]{1,4}:\"[A-Za-z0-9_\\\\]+" "id:1000002,phase:2,t:none,deny,status:403,log,msg:'serialized object in request'"

# gadget-class names inside serialized payloads (extend per app):
SecRule ARGS|REQUEST_BODY "@rx (O|C):[0-9]{1,4}:\"(GuzzleHttp|Monolog|Symfony)" "id:1000003,phase:2,t:none,deny,status:403,log,msg:'known gadget class in serialized payload'"

# Tuning: 1000002 fires on any form field legitimately carrying a serialized
# object (caches, settings forms, Laravel/ThinkPHP session POSTs). When it
# false-positives, prefer a per-path SecRuleRemoveById 1000002 exclusion over
# disabling the rule globally; the WAF is the outermost ring and the least
# trustworthy mitigation in this kit.

# ---------------------------------------------------------------------------
# Imunify360 field-tested rules for the PHP2Shell exploitation tool
# (CVE-2026-109618/109619). Contributed 2026-10-21, kept verbatim including
# IDs (77xxxxxx range - no collision with the rules above) and audit-tag
# format. Signatures, in order:
#   77318849 the tool itself: php2shell- UA prefix or its distinctive
#            multipart boundary markers (B7kQpoc61x / UctxPoc20xx /
#            nphp618 / nphp619 / php2shell inside the boundary string)
#   77830995 PHP_SESSION_UPLOAD_PROGRESS whose VALUE contains a NUL byte
#   77866818 PHP_SESSION_UPLOAD_PROGRESS with NO Referer header
#   77236259 PHP_SESSION_UPLOAD_PROGRESS with a cross-site Referer
#   77571046 audit-log-only sighting of the field (severity 5, pass)
#   77983064 multipart POST without Content-Length (pass, telemetry)
#   77683613 multipart POST with >50 file parts (pass, telemetry)
# The pass/auditlog entries (77571046, 77983064, 77683613) are detection
# telemetry, not blocks - useful for gauging exposure before enabling the
# deny rules above them.
# ---------------------------------------------------------------------------
SecRule REQUEST_HEADERS:User-Agent|REQUEST_HEADERS:Content-Type "@rx (?i)(?:^php2shell\x2d[0-9a-z]{0,16}|[\x3b,\s]boundary\s{0,8}=\s{0,8}\x22?(?:(?:B7kQpoc61[0-9]|UctxPoc20[0-9]{2})(?:[\x22\x3b,\s]|$)|[\x2d]{0,70}nphp61[89]|[\x2d0-9a-z_.]{0,80}php2shell))" "id:77318849,phase:1,block,nolog,auditlog,severity:2,t:none,capture,msg:'IM360 WAF: PHP2Shell exploitation tool request (PHP session upload progress, CVE-2026-109618/109619)||MV:%{TX.0}||RSV:8.85||T:APACHE||',tag:'service_im360'"
SecRule REQUEST_HEADERS:Content-Type "@contains multipart/form-data" "id:77830995,chain,phase:2,block,nolog,auditlog,severity:2,t:none,t:lowercase,msg:'IM360 WAF: PHP session upload progress field with NUL byte form field in multipart request||RSV:8.85||T:APACHE||',tag:'service_im360'"
SecRule ARGS_POST_NAMES|FILES_NAMES "@rx (?i:\APHP_SESSION_UPLOAD_PROGRESS\z)" "chain,t:none"
SecRule ARGS_POST "@rx \x00" "t:none"
SecRule REQUEST_HEADERS:Content-Type "@contains multipart/form-data" "id:77866818,chain,phase:2,block,nolog,auditlog,severity:2,t:none,t:lowercase,msg:'IM360 WAF: PHP session upload progress field in multipart request without same-site Referer||MVN:%{MATCHED_VAR_NAME}||MV:%{MATCHED_VAR}||RSV:8.85||T:APACHE||',tag:'service_im360'"
SecRule &REQUEST_HEADERS:Referer "@eq 0" "chain,t:none"
SecRule ARGS_POST_NAMES|FILES_NAMES "@rx (?i:\APHP_SESSION_UPLOAD_PROGRESS\z)" "t:none"
SecRule REQUEST_HEADERS:Content-Type "@contains multipart/form-data" "id:77236259,chain,phase:2,block,nolog,auditlog,severity:2,t:none,t:lowercase,msg:'IM360 WAF: PHP session upload progress field in multipart request without same-site Referer||MVN:%{MATCHED_VAR_NAME}||MV:%{MATCHED_VAR}||RSV:8.85||T:APACHE||',tag:'service_im360'"
SecRule REQUEST_HEADERS:Referer "@rx ^(?:[a-z][a-z0-9+.\x2d]{0,15}://(?:[^/?#@]{0,256}@)?)?(\[[^\]/?#\x25\x7b\x7d]{1,64}\]|[^/?#:@\[\x25\x7b\x7d]{0,255})" "chain,capture,t:none,t:lowercase"
SecRule REQUEST_HEADERS:Host "!@streq %{TX.1}" "chain,t:none,t:lowercase"
SecRule REQUEST_HEADERS:Host "!@beginsWith %{TX.1}:" "chain,t:none,t:lowercase"
SecRule ARGS_POST_NAMES|FILES_NAMES "@rx (?i:\APHP_SESSION_UPLOAD_PROGRESS\z)" "t:none"
SecRule REQUEST_HEADERS:Content-Type "@contains multipart/form-data" "id:77571046,chain,phase:2,pass,nolog,auditlog,severity:5,t:none,t:lowercase,msg:'IM360 WAF: PHP session upload progress field in multipart request||MVN:%{MATCHED_VAR_NAME}||MV:%{MATCHED_VAR}||RSV:8.85||T:APACHE||',tag:'service_im360'"
SecRule ARGS_POST_NAMES|FILES_NAMES "@rx (?i:\APHP_SESSION_UPLOAD_PROGRESS\z)" "t:none"
SecRule REQUEST_HEADERS:Content-Type "@rx (?i)^\s{0,8}multipart/form-data(?:\s{0,8};\s{0,8}boundary\s{0,8}=\s{0,8}\x22?[0-9a-z_.\x2d]{0,70})?" "id:77983064,chain,phase:1,pass,nolog,auditlog,severity:5,t:none,capture,msg:'IM360 WAF: multipart request without Content-Length||MV:%{TX.0}||RSV:8.85||T:APACHE||',tag:'service_im360'"
SecRule &REQUEST_HEADERS:Content-Length "@eq 0" "t:none"
SecRule REQUEST_HEADERS:Content-Type "@rx (?i)^\s{0,8}multipart/form-data" "id:77683613,chain,phase:2,pass,nolog,auditlog,severity:5,t:none,msg:'IM360 WAF: multipart request with many file parts||RSV:8.85||T:APACHE||',tag:'service_im360'"
SecRule &FILES_NAMES "@gt 50" "t:none"
