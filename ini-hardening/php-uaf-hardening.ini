; php-uaf ini hardening - surface reduction and payoff decapitation.
; These shrink the attack surface; they do NOT fix the underlying
; reentrancy bug (apply the patches or run the runtime blocker for that).
; Drop into conf.d/ or set per-pool (php-fpm) / per-domain (cPanel MultiPHP).

; Removes the upload-progress surface entirely (most apps do not use it):
session.upload_progress.enabled = Off

; Block the phar entry chain at the PHP level as well as the WAF level.
; Off breaks apps that legitimately WRITE phars; reading stays allowed.
phar.readonly = On
phar.require_hash = On

; One reentrancy path (class-not-found callback) - keep empty, always:
unserialize_callback_func =

; Bound serialized-payload recursion (default 4096; tighten if your app
; allows it):
unserialize_max_depth = 4096

; Kill the payoff stage every chain ends in. Adjust per app; some
; frameworks shell out legitimately (composer, image processing):
disable_functions = system,exec,shell_exec,passthru,proc_open,popen

; Per-vhost or per-pool session storage (NOT a shared /tmp) blocks the
; attacker-planted session-file delivery chain - set per environment,
; example:
; session.save_path = "/var/lib/php/sessions/{{vhost}}"
